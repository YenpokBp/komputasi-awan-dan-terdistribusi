version: "3.8"

services:
  app1:
    build: ./app
    container_name: vertical-app
    environment:
      - INSTANCE_ID=app1
      - PORT=8000
    ports:
      - "8080:8000"
    cpus: 2.0
    mem_limit: 512m
  app2:
    build: ./app
    environment:
      - INSTANCE_ID=app2
      - PORT=8000

  app3:
    build: ./app
    environment:
      - INSTANCE_ID=app3
      - PORT=8000

  app4:
    build: ./app
    environment:
      - INSTANCE_ID=app4
      - PORT=8000

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
      - app4